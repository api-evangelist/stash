aid: stash
name: Stash
description: >-
  Stash is an investing and banking app that enables fractional share investing,
  automated portfolio building, bank account management with a Stock-Back debit
  card, custodial accounts for minors, IRA retirement accounts, and financial
  education content. Stash serves over one million customers and has $4.3 billion
  under management, offering subscription-based access to a hybrid DIY and
  robo-advisor investing experience starting at $3 per month.
