apis:
  - aid: stash:stash-investing-api
    name: Stash Investing API
    description: >-
      Stash provides a mobile-first investing and banking platform enabling
      fractional share purchases, automated smart portfolio management,
      retirement accounts, and a Stock-Back debit card. The platform is
      consumer-focused without a public developer API portal; programmatic
      access to Stash account data is available through Open Banking aggregators
      such as Plaid that support Stash connectivity.
