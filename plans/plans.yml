plans:
  - name: Stash Growth
    description: >-
      Entry-level subscription providing access to personal brokerage, smart
      robo-advisor portfolio, retirement IRA, and banking features including
      a Stock-Back debit card with 1% stock rewards, early pay up to 2 days,
      $1,000 life insurance, and personalized investment guidance.
    url: https://www.stash.com/pricing
    price: "$3.00"
    billing: monthly
    features:
      - Personal Portfolio (DIY brokerage)
      - Smart Portfolio (robo-advisor managed)
      - Retirement Portfolio (self-managed IRA)
      - Fractional shares
      - Commission-free stock and ETF trading
      - Stock-Back debit card (1% stock rewards up to $1,000/month)
      - Bank account with early pay (up to 2 days)
      - $1,000 life insurance policy
      - Quarterly portfolio rebalancing
      - Personalized investment guidance
      - AI-powered Money Coach
      - Educational content via Stash Learn
      - 7-day free trial

  - name: Stash+
    description: >-
      Premium subscription with all Growth features plus up to two custodial
      investment accounts for children, enhanced Stock-Back card rewards,
      3% IRA contribution matching, and expanded life insurance coverage.
    url: https://www.stash.com/pricing
    price: "$12.00"
    billing: monthly
    features:
      - All Stash Growth features
      - Up to two Kids Portfolios (custodial accounts)
      - Stock-Back card earning 1% in stock (up to $1,000/month cap)
      - 3% match on IRA retirement contributions
      - $10,000 life insurance policy
      - Enhanced quarterly portfolio reviews
      - 7-day free trial
